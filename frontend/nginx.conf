# nginx ภายในคอนเทนเนอร์ frontend
# ด้านหน้ายังต้องมี reverse proxy ที่ทำ HTTPS บน VPS (ดู README หัวข้อ Deploy)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ไฟล์ Excel สูงสุด 5MB
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # URL หน้าเช็กชื่อมี token อยู่ ไม่ส่งต่อให้เว็บอื่นผ่าน Referer
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:4802;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # ไฟล์ที่มี hash ในชื่อ แคชได้ยาว
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: รีเฟรชหน้า /admin/report แล้วต้องไม่ 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
